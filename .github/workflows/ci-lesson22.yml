name: CI Lesson22

on:
  push:
    branches:
      - '**'
    paths:
      - 'lesson22/**'
      - '.github/workflows/ci-lesson22.yml'
  pull_request:
    paths:
      - 'lesson22/**'
      - '.github/workflows/ci-lesson22.yml'

jobs:
  test:
    name: Run Playwright Tests (lesson22)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL }}
      LOGIN: ${{ secrets.LOGIN || vars.LOGIN }}
      PASSWORD: ${{ secrets.PASSWORD || vars.PASSWORD }}

    defaults:
      run:
        working-directory: lesson22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lesson22/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate required environment variables
        run: |
          missing=0
          for v in BASE_URL LOGIN PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing required value: $v (set either a Repository Secret or Variable)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run test suite
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-lesson22
          path: lesson22/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-lesson22
          path: lesson22/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report-lesson22
          path: lesson22/mochawesome-report/
          if-no-files-found: ignore
          retention-days: 14